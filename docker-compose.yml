services:
  fraud-api:
    build:
      context: .
    image: card-fraud-service:dev
    ports:
      - "8000:8000"
    env_file: configs/dev.env      # non-secret dev settings only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M             # find memory problems on the laptop, not in production
